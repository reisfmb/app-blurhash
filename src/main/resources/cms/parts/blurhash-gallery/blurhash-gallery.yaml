kind: "Part"
title: "Blurhash Gallery"
description: "All images directly under the chosen folder (default: the current folder, else the site), lazy-loaded over their BlurHash placeholder"
form:
  - type: "ContentSelector"
    name: "folder"
    label: "Folder"
    helpText: "Images directly under this folder are shown. Empty = the folder this page is on, else the site."
    occurrences:
      min: 0
      max: 1
    allowContentType:
      - "base:folder"
      - "portal:site"
